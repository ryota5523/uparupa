<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まなみん神経衰弱｜大野愛実 ファンサイト</title>
<link rel="stylesheet" href="style.css?v=shared-20261118">
<meta name="theme-color" content="#e60012">
<style>
.memory-wrap{padding:18px 0 30px}
.memory-intro{text-align:center;margin:0 0 18px}
.memory-intro h2{font-size:1.2rem;margin:0 0 5px}
.memory-intro p{font-size:.84rem;color:var(--sub);margin:0;line-height:1.7}
.memory-hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 14px}
.memory-stat{text-align:center;padding:10px 5px;border:1px solid var(--line);border-radius:13px;background:#fff}
.memory-stat small{display:block;color:var(--sub);font-size:.7rem}
.memory-stat strong{font-size:1.18rem;color:var(--accent);font-variant-numeric:tabular-nums}
.memory-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;perspective:900px}
.memory-card{position:relative;aspect-ratio:3/4;min-width:0;border:0;padding:0;background:transparent;cursor:pointer;perspective:700px;-webkit-tap-highlight-color:transparent}
.memory-card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.2,.7,.2,1)}
.memory-card.flipped .memory-card-inner,.memory-card.matched .memory-card-inner{transform:rotateY(180deg)}
.memory-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 3px 9px rgba(74,31,22,.1)}
.memory-back{background:linear-gradient(145deg,#f20b20,#b90012);border:2px solid #fff;outline:1px solid #e60012;color:#fff}
.memory-back::before{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.65);border-radius:7px}
.memory-back span{font-size:clamp(1.45rem,7vw,2.3rem);text-shadow:0 2px 5px #7d0010}
.memory-front{transform:rotateY(180deg);background:#fff;border:1px solid var(--line);padding:4px}
.memory-front img{width:100%;height:100%;object-fit:contain;display:block}
.memory-card.matched .memory-front{border:2px solid #e60012;box-shadow:0 0 0 2px #e6001222}
.memory-card:disabled{cursor:default}
.memory-actions{display:flex;justify-content:center;gap:10px;margin:17px 0 4px}
.memory-actions button{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--text);padding:10px 19px;font:inherit;font-size:.84rem;font-weight:700}
.memory-actions .primary{background:#e60012;color:#fff;border-color:#e60012}
.memory-message{min-height:2em;text-align:center;color:var(--accent);font-size:.9rem;font-weight:800;margin:12px 0 0}
.memory-note{text-align:center;color:var(--sub);font-size:.75rem;margin:10px 0}
.memory-loading{text-align:center;padding:34px 12px;color:var(--sub);background:#fff7f7;border-radius:16px}
@media(min-width:560px){.memory-board{gap:13px;max-width:560px;margin:0 auto}.memory-card{aspect-ratio:3/4}.memory-face{border-radius:16px}.memory-front{padding:6px}}
@media(max-width:360px){.memory-board{gap:6px}.memory-face{border-radius:9px}}
@media(prefers-reduced-motion:reduce){.memory-card-inner{transition:none}}
</style>
</head>
<body>
<div class="appbar"><a href="index.html"><img src="logo.png" alt="" class="logo"><span><b>MANAMI</b><small>大野愛実 ファンサイト（非公式）</small></span></a></div>
<div class="wrap">
<header><span class="badge">MINI GAME</span><h1>まなみん神経衰弱</h1><p class="kana">同じ写真をそろえよう！</p></header>
<nav>
<a href="index.html"><i class="ms">home</i>Home</a>
<a href="profile.html"><i class="ms">person</i>Profile</a>
<a href="schedule.html"><i class="ms">calendar_month</i>Schedule</a>
<a href="news.html"><i class="ms">newspaper</i>News</a>
<a href="works.html"><i class="ms">movie</i>Works</a>
<a href="blog.html"><i class="ms">edit_note</i>Blog</a>
</nav>
<main class="memory-wrap">
<div class="memory-intro"><h2>16枚のカードから、8ペアを見つけよう！</h2><p>Cloudflareに保存してある縦長写真を使っているよ。<br>同じ写真を2枚めくるとペア成立 💗</p></div>
<div class="memory-hud">
<div class="memory-stat"><small>手数</small><strong id="moves">0</strong></div>
<div class="memory-stat"><small>そろえたペア</small><strong id="pairs">0 / 8</strong></div>
<div class="memory-stat"><small>タイム</small><strong id="timer">00:00</strong></div>
</div>
<div id="memoryBoard" class="memory-board" aria-label="神経衰弱のカード一覧"><div class="memory-loading" style="grid-column:1/-1">Cloudflareの写真を読み込み中…</div></div>
<p class="memory-message" id="message" aria-live="polite"></p>
<div class="memory-actions"><button class="primary" id="restart" type="button">もう一度あそぶ</button></div>
<p class="memory-note">写真は毎回ランダムに8種類選ばれるよ。</p>
</main>
</div>
<script>
(()=>{
const API="https://manami-site-worker.yellowworker.workers.dev/api/menu-photos";
const board=document.getElementById("memoryBoard"),movesEl=document.getElementById("moves"),pairsEl=document.getElementById("pairs"),timerEl=document.getElementById("timer"),messageEl=document.getElementById("message");
const BEST_KEY="manami-memory-best-v1";
let photos=[],cards=[],opened=[],moves=0,pairs=0,seconds=0,clock=null,locked=false,started=false,finished=false;
const shuffle=array=>{const a=[...array];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function formatTime(n){return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function updateHud(){movesEl.textContent=moves;pairsEl.textContent=pairs+" / 8";timerEl.textContent=formatTime(seconds)}
function stopClock(){if(clock){clearInterval(clock);clock=null}}
function startClock(){if(clock||started)return;started=true;clock=setInterval(()=>{seconds++;timerEl.textContent=formatTime(seconds)},1000)}
function makeCard(photo,index){
 const button=document.createElement("button");button.type="button";button.className="memory-card";button.setAttribute("aria-label","カード "+(index+1));button.dataset.pair=photo.pairId;
 const inner=document.createElement("span");inner.className="memory-card-inner";
 const back=document.createElement("span");back.className="memory-face memory-back";back.innerHTML="<span>♡</span>";
 const front=document.createElement("span");front.className="memory-face memory-front";
 const img=document.createElement("img");img.src=photo.url;img.alt="大野愛実の写真";img.loading="eager";img.decoding="async";front.appendChild(img);
 inner.append(back,front);button.appendChild(inner);button.addEventListener("click",()=>flip(button));return button;
}
function flip(button){
 if(locked||finished||button.classList.contains("flipped")||button.classList.contains("matched"))return;
 startClock();button.classList.add("flipped");opened.push(button);
 if(opened.length===2){
  moves++;updateHud();const [a,b]=opened;
  if(a.dataset.pair===b.dataset.pair){
   a.classList.add("matched");b.classList.add("matched");a.disabled=true;b.disabled=true;opened=[];pairs++;updateHud();
   if(pairs===8){finished=true;stopClock();const best=Number(localStorage.getItem(BEST_KEY))||0;let note="全ペア発見！おめでとう！！";if(!best||seconds<best){try{localStorage.setItem(BEST_KEY,String(seconds))}catch(e){}note+=" 新記録！";}messageEl.textContent=note+" "+formatTime(seconds)+" / "+moves+"手";}
   else messageEl.textContent="ペア成立！その調子 💗";
  }else{
   locked=true;messageEl.textContent="おしい！もう一度チャレンジ";
   setTimeout(()=>{a.classList.remove("flipped");b.classList.remove("flipped");opened=[];locked=false;},850);
  }
 }
}
function newGame(){
 stopClock();moves=0;pairs=0;seconds=0;opened=[];locked=false;started=false;finished=false;messageEl.textContent="";updateHud();
 const chosen=shuffle(photos).slice(0,8).map((photo,i)=>({...photo,pairId:String(i)}));
 cards=shuffle(chosen.flatMap(photo=>[{...photo},{...photo}]));
 board.innerHTML="";cards.forEach((photo,i)=>board.appendChild(makeCard(photo,i)));
}
async function loadPhotos(){
 try{
  const response=await fetch(API+"?t="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error("画像一覧を取得できません");
  const data=await response.json();const items=Array.isArray(data.items)?data.items:[];
  const unique=[...new Map(items.filter(p=>p&&typeof p.url==="string"&&p.url.startsWith("https://")).map(p=>[p.url,p])).values()];
  const loaded=await Promise.all(unique.map(photo=>new Promise(resolve=>{
   const img=new Image();img.onload=()=>resolve(img.naturalHeight>img.naturalWidth?{...photo,width:img.naturalWidth,height:img.naturalHeight}:null);img.onerror=()=>resolve(null);img.src=photo.url;
  })));
  photos=loaded.filter(Boolean);
  if(photos.length<8)throw new Error("縦長写真が8種類見つかりませんでした（現在 "+photos.length+" 種類）");
  newGame();
 }catch(error){
  console.error("Memory game photo load failed:",error);
  board.innerHTML='<div class="memory-loading" style="grid-column:1/-1">写真を読み込めなかったみたい…<br>'+String(error.message||"時間をおいて再読み込みしてね")+'</div>';
  messageEl.textContent="ページを再読み込みしてね。";
  document.getElementById("restart").disabled=true;
 }
}
document.getElementById("restart").addEventListener("click",()=>{if(photos.length>=8)newGame()});
loadPhotos();
})();
</script>
<script id="manami-nav-active">
(()=>{const current=location.pathname.split("/").pop()||"index.html";document.querySelectorAll("nav a[href]").forEach(a=>{const target=new URL(a.getAttribute("href"),location.href).pathname.split("/").pop();if(target===current){a.classList.add("on");a.setAttribute("aria-current","page");}else{a.classList.remove("on");a.removeAttribute("aria-current");}});})();
</script>
<script src="egg.js" defer></script>
</body></html>
