<section><h2>Latest News</h2><p class="empty" style="margin-bottom:8px">日向坂46公式サイトのニュースのうち、大野愛実さんに関するものだけをまとめています。</p><div id="l"></div>
<a class="more" href="https://www.hinatazaka46.com/s/official/news/list" target="_blank" rel="noopener">公式サイトのニュース一覧 →</a></section>
<footer><p>このサイトは有志による非公式ファンサイトです。日向坂46・運営・所属事務所とは一切関係ありません。<br>掲載内容は報道・公式発表をもとにまとめたものです。正確な情報は公式サイトをご確認ください。</p></footer></div><script>
(function(){
  const API = "https://manami-site-worker.yellowworker.workers.dev/api/news";
  const el = document.getElementById("l");
  fetch(API).then(r => {
    if (!r.ok) throw new Error("API error");
    return r.json();
  }).then(data => {
    if (!data.ok || !Array.isArray(data.items)) throw new Error("データを取得できません");
    const items = data.items.filter(item => /大野愛実/.test(item.title || ""));
    if (!items.length) {
      el.textContent = "現在、掲載できるニュースはありません。";
      return;
    }
    items.forEach(item => {
      const d = document.createElement("div");
      d.className = "item";
      const date = document.createElement("div");
      date.className = "date";
      date.textContent = (item.published_at || "").replace(/-/g, ".");
      const category = document.createElement("span");
      category.className = "cat";
      category.textContent = item.category || "News";
      date.appendChild(category);
      const link = document.createElement("a");
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = item.title;
      d.appendChild(date);
      d.appendChild(link);
      el.appendChild(d);
    });
  }).catch(() => {
    el.textContent = "ニュースを読み込めませんでした。公式サイトをご確認ください。";
  });
})();
</script><script src="egg.js" defer></script></body></html>
