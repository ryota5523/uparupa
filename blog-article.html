<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog Article｜大野愛実 ファンサイト（非公式）</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico" sizes="any">
<meta name="theme-color" content="#c91532">
<style>
:root{--article-red:#c91532;--article-ink:#292326;--article-muted:#8a7b80}
.article-shell{max-width:820px;margin:0 auto;padding:12px 0 34px}
.article-back{display:inline-flex;align-items:center;gap:8px;margin:8px 0 20px;padding:10px 15px;border:1px solid #efc7cf;border-radius:999px;background:#fff7f8;color:#a9142e;font:700 .88rem inherit;text-decoration:none}
.article-label{display:inline-flex;padding:5px 11px;border-radius:99px;background:#fff0f2;color:var(--article-red);font-size:.7rem;font-weight:900;letter-spacing:.12em}
.article-title{margin:12px 0 8px;color:var(--article-ink);font-size:clamp(1.45rem,5vw,2.1rem);line-height:1.55;overflow-wrap:anywhere}
.article-meta{padding-bottom:18px;border-bottom:1px solid #f0dfe2;color:var(--article-muted);font-size:.8rem}
.article-body{padding:20px 0 30px;color:var(--article-ink);font-size:1rem;line-height:2;overflow-wrap:anywhere}
.article-body p{margin:0 0 1.2em}
.article-body h2,.article-body h3{margin:1.8em 0 .7em;line-height:1.5}
.article-body h2{font-size:1.25rem;border-left:4px solid var(--article-red);padding-left:12px}
.article-body h3{font-size:1.08rem}
.article-body img{display:block;width:100%;height:auto;max-height:900px;object-fit:contain;margin:22px auto;border-radius:14px;background:#fff7f8}
.article-body a{text-decoration:underline}
.article-body blockquote{margin:16px 0;padding:8px 14px;border-left:3px solid var(--article-red);background:#fff7f8}
.article-loading,.article-error{padding:36px 12px;text-align:center;color:var(--article-muted)}
.article-official{display:block;margin:18px auto 0;width:max-content;max-width:100%;padding:12px 18px;border-radius:999px;background:var(--article-red);color:#fff;text-decoration:none;font-weight:800}
.article-end{margin-top:28px;padding-top:20px;border-top:1px solid #f0dfe2;text-align:center}
@media(max-width:600px){.article-shell{padding-top:4px}.article-body{font-size:.96rem}.article-body img{border-radius:10px}}
</style>
</head>
<body>
<div class="appbar"><a href="index.html"><img src="logo.png" alt="" class="logo"><span><b>MANAMI</b><small>大野愛実 ファンサイト（非公式）</small></span></a></div>
<div class="wrap">
<nav>
<a href="index.html"><i class="ms">home</i>Home</a>
<a href="profile.html"><i class="ms">person</i>Profile</a>
<a href="schedule.html"><i class="ms">calendar_month</i>Schedule</a>
<a href="news.html"><i class="ms">newspaper</i>News</a>
<a href="works.html"><i class="ms">movie</i>Works</a>
<a href="blog.html" class="on"><i class="ms">edit_note</i>Blog</a>
</nav>
<main class="article-shell">
<a class="article-back" href="blog.html">‹ ブログ一覧に戻る</a>
<article>
<span class="article-label">MANAMI'S BLOG</span>
<h1 id="article-title" class="article-title">ブログ記事</h1>
<div id="article-meta" class="article-meta">大野 愛実</div>
<div id="article-body" class="article-body"><div class="article-loading">ブログ記事を読み込んでいます…</div></div>
</article>
<div class="article-end"><a class="article-back" href="blog.html">‹ ほかのブログも読む</a></div>
</main>
<footer><p>このサイトは有志による非公式ファンサイトです。日向坂46・運営・所属事務所とは一切関係ありません。<br>掲載内容は報道・公式発表をもとにまとめたものです。正確な情報は公式サイトをご確認ください。</p></footer>
</div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const rawUrl=params.get("url")||"";
  const title=params.get("title")||"ブログ記事";
  const date=params.get("date")||"大野 愛実";
  const titleEl=document.getElementById("article-title");
  const metaEl=document.getElementById("article-meta");
  const bodyEl=document.getElementById("article-body");
  titleEl.textContent=title;
  metaEl.textContent=date+" · 大野 愛実";
  document.title=title+"｜大野愛実 ファンサイト";
  let officialUrl;
  try{
    officialUrl=new URL(rawUrl);
    if(officialUrl.protocol!=="https:"||!/(^|\.)hinatazaka46\.com$/i.test(officialUrl.hostname))throw new Error("invalid host");
  }catch(e){
    bodyEl.innerHTML='<p class="article-error">記事のURLを確認できませんでした。</p>';
    return;
  }
  const memberNames=["石塚 瑶季","大田 美月","大野 愛実","片山 紗希","金村 美玖","上村 ひなの","蔵盛 妃那乃","小坂 菜緒","小西 夏菜実","坂井 新奈","佐藤 優羽","清水 理央","下田 衣珠季","正源司 陽子","高井 俐香","髙橋 未来虹","竹内 希来里","鶴崎 仁香","平尾 帆夏","平岡 海月","藤嶌 果歩","松尾 桜","宮地 すみれ","森本 茉莉","山下 葉留花","渡辺 莉奈","ポカ"];
  function chromeLine(value){
    const s=value.trim();
    if(!s)return true;
    if(/^＜?\s*\d{4}年\d{1,2}月\s*＞?\s*(?:\d{1,2}\s*){3,}$/u.test(s))return true;
    if(/^Cookie Settings\s*OK?$/i.test(s))return true;
    if(memberNames.filter(name=>s.includes(name)).length>=10)return true;
    if(/^(?:ニュース|スケジュール|メンバー|フォーメーション|ブログ|ディスコグラフィー|動画|TV|ミート＆グリート|日向坂46とは？|ファンクラブ|グッズ|OFFICIAL BLOG|プロフィール詳細|大野 愛実 公式ブログ|おおの まなみ)$/i.test(s))return true;
    if(/^(?:NEW ENTRY|メンバー別ブログ|OFFICIAL|FAN CLUB|Cookie Policy|Cookie Notice|Manage Consent Preferences|Cookie List|Clear|Apply Cancel|Always Active|OK|Save Settings)$/i.test(s))return true;
    if(/^https?:\/\//i.test(s)||/^Image\s*\d+$/i.test(s))return true;
    return false;
  }
  function validImage(src){
    try{const u=new URL(src);return u.protocol==="https:"&&u.hostname==="cdn.hinatazaka46.com"&&/\/diary\/official\/member\//i.test(u.pathname)&&/\.(jpe?g|png|webp)$/i.test(u.pathname)&&!/(logo|icon|avatar|banner|header|bg_)/i.test(u.pathname);}catch(e){return false;}
  }
  function addImage(src){
    if(!validImage(src))return;
    const img=document.createElement("img");img.src=src;img.alt="ブログ写真";img.loading="lazy";img.referrerPolicy="no-referrer";img.onerror=()=>img.remove();bodyEl.append(img);
  }
  function addText(tag,text){
    if(chromeLine(text))return;
    const el=document.createElement(tag);el.textContent=text;bodyEl.append(el);
  }
  function renderMarkdown(source){
    bodyEl.innerHTML="";
    const lines=source.replace(/\r/g,"").split("\n");
    let paragraph=[];
    function flush(){
      if(!paragraph.length)return;
      const value=paragraph.join(" ").trim();paragraph=[];
      if(chromeLine(value))return;
      const p=document.createElement("p");
      const linkPattern=/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g;
      let cursor=0,m;
      while((m=linkPattern.exec(value))){
        p.append(document.createTextNode(value.slice(cursor,m.index)));
        try{const u=new URL(m[2]);if(u.protocol==="https:"){const a=document.createElement("a");a.href=u.href;a.target="_blank";a.rel="noopener noreferrer";a.textContent=m[1];p.append(a);}else p.append(document.createTextNode(m[1]));}catch(e){p.append(document.createTextNode(m[1]));}
        cursor=linkPattern.lastIndex;
      }
      p.append(document.createTextNode(value.slice(cursor)));
      bodyEl.append(p);
    }
    for(const original of lines){
      const line=original.trim();
      if(!line){flush();continue;}
      if(/^Markdown Content:$/i.test(line)||/^(?:Title|URL Source|Published Time):/.test(line))continue;
      if(/<p\b[^>]*>/i.test(line)){
        flush();
        const wrapper=document.createElement("div");wrapper.innerHTML=line;
        const p=wrapper.querySelector("p");
        if(p){
          const text=(p.textContent||"").replace(/\s+/g," ").trim();
          if(!chromeLine(text)){
            const imgs=[...p.querySelectorAll("img")].map(x=>x.getAttribute("src")).filter(Boolean);
            if(text)addText("p",text);
            imgs.forEach(addImage);
          }
        }
        continue;
      }
      if(/<img\b/i.test(line)){
        flush();
        [...line.matchAll(/<img[^>]+src=["'](https:\/\/[^"']+)["']/gi)].forEach(m=>addImage(m[1]));
        continue;
      }
      const imageMatches=[...line.matchAll(/!?\[[^\]]*\]\(<?(https:\/\/[^\s)>]+)>?\)/g)].map(m=>m[1]);
      if(imageMatches.length){flush();imageMatches.forEach(addImage);continue;}
      if(/<(?:html|head|body|header|nav|footer|h[1-6]|div|svg)\b/i.test(line)){flush();continue;}
      if(chromeLine(line))continue;
      if(/^#{1,3}\s/.test(line)){flush();const level=line.startsWith("# ")?"h2":"h3";addText(level,line.replace(/^#{1,3}\s+/,""));continue;}
      if(/^>\s?/.test(line)){flush();addText("blockquote",line.replace(/^>\s?/,""));continue;}
      if(/^[-*]\s+/.test(line)){flush();addText("p","・"+line.replace(/^[-*]\s+/,""));continue;}
      const clean=line.replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,"$1").replace(/\*\*([^*]+)\*\*/g,"$1").replace(/\*([^*]+)\*/g,"$1").trim();
      if(clean)paragraph.push(clean);
    }
    flush();
  }
  async function load(){
    try{
      const response=await fetch("https://r.jina.ai/"+officialUrl.href,{headers:{"Accept":"text/plain","X-Target-Selector":".c-blog-article__text","X-Respond-With":"markdown","X-No-Cache":"true"}});
      if(!response.ok)throw new Error("reader error");
      let source=await response.text();
      const marker=source.indexOf("Markdown Content:");
      if(marker>=0)source=source.slice(marker+"Markdown Content:".length);
      renderMarkdown(source);
      if(!bodyEl.childElementCount)throw new Error("empty article");
      const official=document.createElement("a");official.className="article-official";official.href=officialUrl.href;official.target="_blank";official.rel="noopener noreferrer";official.textContent="公式ブログで読む ↗";
      bodyEl.append(official);
    }catch(error){
      bodyEl.innerHTML='<p class="article-error">記事本文を読み込めなかったよ。通信を確認して、もう一度開いてみてね。</p>';
      const link=document.createElement("a");link.className="article-official";link.href=officialUrl.href;link.target="_blank";link.rel="noopener noreferrer";link.textContent="公式ブログで開く ↗";bodyEl.append(link);
    }
  }
  load();
})();
</script>
<script src="egg.js" defer></script>
</body>
</html>
