.swim-intro{text-align:center;margin:4px 0 12px;color:var(--sub);font-size:.84rem}
.swim-hud{display:flex;gap:8px;margin:0 0 9px}.swim-stat{flex:1;text-align:center;padding:8px 5px;border:1px solid var(--line);border-radius:12px;background:#fff}.swim-stat small{display:block;color:var(--sub);font-size:.68rem}.swim-stat strong{font-size:1.2rem;color:var(--accent);font-variant-numeric:tabular-nums}
#swimCanvas{display:block;width:100%;height:auto;aspect-ratio:360/560;border:2px solid #b6eaf3;border-radius:20px;background:#087eaa;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 7px 20px rgba(15,70,90,.14);-webkit-tap-highlight-color:transparent}
.swim-controls{display:flex;justify-content:center;gap:9px;margin:13px 0 4px}.swim-controls button{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:11px 24px;font:inherit;font-weight:800;box-shadow:0 4px 0 #b90012}.swim-controls button:active{transform:translateY(2px);box-shadow:0 2px 0 #b90012}
.swim-note{text-align:center;color:var(--sub);font-size:.76rem;margin:10px 0}

<main class="memory-wrap">
<p class="swim-intro">坂道やでこぼこ道を駆け抜けよう！タップでジャンプして障害物を回避！</p>
<div class="swim-hud"><div class="swim-stat"><small>TIME</small><strong id="time">0.0s</strong></div><div class="swim-stat"><small>BEST</small><strong id="best">0.0s</strong></div><div class="swim-stat"><small>LEVEL</small><strong id="level">1</strong></div></div>
<canvas id="swimCanvas" width="360" height="560" aria-label="上下に操作して障害物を避ける横スクロールゲーム"></canvas>
<div class="swim-controls"><button id="startBtn">泳ぎはじめる！</button></div>
<p class="swim-note">画面タップでジャンプ！連続タップで二段ジャンプはできないよ。タイミングを見極めてね 🫧</p>
</main>
</div>
<script>
(()=>{
const canvas=document.getElementById('swimCanvas'),ctx=canvas.getContext('2d');
const timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),levelEl=document.getElementById('level'),startBtn=document.getElementById('startBtn');
const W=360,H=560,GROUND=456,player={x:88,y:GROUND-24,r:18,vy:0,onGround:true},img=new Image();img.src='axolotl.png';
let state='ready',elapsed=0,best=Number(localStorage.getItem('upaSwimBestTime')||0),obstacles=[],bubbles=[],frame=0,last=0,raf=0,world=0,jumpHeld=false;
bestEl.textContent=best.toFixed(1)+'s';
function reset(){elapsed=0;frame=0;world=0;player.y=groundAt(player.x)-24;player.vy=0;player.onGround=true;obstacles=[];bubbles=[];for(let i=0;i<24;i++)bubbles.push({x:Math.random()*W,y:Math.random()*(GROUND-35),r:1+Math.random()*3,v:.5+Math.random()});timeEl.textContent='0.0s';levelEl.textContent='1'}
function difficulty(){return Math.min(1,(elapsed/90))}
function groundAt(x){const p=x+world;return GROUND+27*(Math.sin(p/145)-Math.sin(88/145))+11*(Math.sin(p/62)-Math.sin(88/62))}
function spawn(){const d=difficulty(),types=['rock','roots','reeds','log','weed','stones'];const type=types[Math.floor(Math.random()*types.length)];const overhead=Math.random()<(elapsed>22?.28:.12);obstacles.push({x:W+30,y:overhead?92:GROUND-12,type,overhead,seed:Math.random()*10,phase:Math.random()*Math.PI*2,amp:type==='weed'||type==='reeds'?7:2,w:52,h:44})}
function start(){cancelAnimationFrame(raf);reset();state='play';startBtn.textContent='もう一度泳ぐ';last=0;raf=requestAnimationFrame(loop)}
function jump(){if(state!=='play'){start();return}if(player.onGround){player.vy=-10.8;player.onGround=false}}
function down(e){e.preventDefault();jump()}
function finish(){state='over';if(elapsed>best){best=elapsed;localStorage.setItem('upaSwimBestTime',String(best));bestEl.textContent=best.toFixed(1)+'s'}startBtn.textContent='もう一度泳ぐ'}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function background(){
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#83d9dc');g.addColorStop(.22,'#4bb9bd');g.addColorStop(.7,'#238f91');g.addColorStop(1,'#176d70');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(238,255,220,.13)';for(let i=0;i<5;i++){const x=(i*92-world*.12%500+500)%500;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+34,0);ctx.lineTo(x+105,H);ctx.lineTo(x+64,H);ctx.closePath();ctx.fill()}
ctx.fillStyle='rgba(231,255,247,.35)';for(const b of bubbles){ctx.beginPath();ctx.arc((b.x-world*.12%W+W)%W,b.y,b.r,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='#b4a77c';ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=8)ctx.lineTo(x,H-22-Math.sin(x*.025+world*.012)*10);ctx.lineTo(W,H);ctx.fill();ctx.globalAlpha=1;
for(let i=0;i<14;i++){const x=(i*37-world*.45%420+420)%420,y=H-17-Math.sin(i*8)*5;ctx.fillStyle=i%2?'#d3c49a':'#829d7b';ctx.beginPath();ctx.ellipse(x,y,5+(i%3)*2,2,0,0,Math.PI*2);ctx.fill()}
for(let side=0;side<2;side++){const base=side?W-7:7;for(let j=0;j<4;j++){const sway=Math.sin(world*.025+j*1.8)*9;ctx.strokeStyle=j%2?'rgba(28,112,77,.72)':'rgba(91,157,94,.8)';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(base,H-5);ctx.quadraticCurveTo(base+sway*1.5,H-75-j*13,base+sway,H-115-j*17);ctx.stroke()}}
}
function rockShape(x,y,w,h){ctx.fillStyle='#718d79';ctx.strokeStyle='#496f68';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-w/2,y+h/2);ctx.quadraticCurveTo(x-w*.72,y,x-w*.25,y-h*.42);ctx.quadraticCurveTo(x+w*.15,y-h*.7,x+w*.43,y-h*.22);ctx.quadraticCurveTo(x+w*.75,y+h*.08,x+w/2,y+h/2);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='rgba(220,232,180,.28)';ctx.beginPath();ctx.ellipse(x-w*.12,y-h*.2,w*.18,h*.09,-.3,0,Math.PI*2);ctx.fill()}
function reedShape(x,y,flip,seed){ctx.save();ctx.translate(x,y);if(flip)ctx.scale(1,-1);for(let i=0;i<4;i++){const dx=(i-1.5)*9,lean=Math.sin(seed+i)*8;ctx.strokeStyle=i%2?'#367f59':'#5b9e68';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(dx,0);ctx.quadraticCurveTo(dx+lean,-18,dx+lean*.7,-38-(i%2)*9);ctx.stroke();ctx.fillStyle='#79b66e';ctx.beginPath();ctx.ellipse(dx+lean*.7,-39-(i%2)*9,4,10,.2,0,Math.PI*2);ctx.fill()}ctx.restore()}
function rootsShape(x,y,flip,seed){ctx.save();ctx.translate(x,y);if(flip)ctx.scale(1,-1);ctx.strokeStyle='#80684a';ctx.lineWidth=7;ctx.lineCap='round';for(let i=0;i<4;i++){const dx=(i-1.5)*10;ctx.beginPath();ctx.moveTo(dx,-2);ctx.bezierCurveTo(dx-12,-18,dx+Math.sin(seed+i)*8,-28,dx+(i-1)*13,-48-(i%2)*9);ctx.stroke()}ctx.restore()}
function logShape(x,y,flip){ctx.save();ctx.translate(x,y);if(flip)ctx.scale(1,-1);ctx.fillStyle='#8a7251';ctx.strokeStyle='#66553f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-24,0);ctx.lineTo(-20,-27);ctx.quadraticCurveTo(0,-37,23,-25);ctx.lineTo(25,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#c1a176';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-26,8,4,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
function weedShape(x,y,flip,seed){ctx.save();ctx.translate(x,y);if(flip)ctx.scale(1,-1);for(let i=0;i<3;i++){ctx.fillStyle=i%2?'#4c9c72':'#70b77a';ctx.beginPath();ctx.ellipse((i-1)*12,-20-Math.sin(seed+i)*5,7,24,.3*(i-1),0,Math.PI*2);ctx.fill()}ctx.restore()}
function obstacle(o){const bob=Math.sin(frame*.055+o.phase)*o.amp,x=o.x+24,floor=groundAt(x);if(o.overhead){if(o.type==='roots')rootsShape(x,o.y+48+bob,false,o.seed);else if(o.type==='reeds')reedShape(x,o.y+42+bob,false,o.seed);else if(o.type==='weed')weedShape(x,o.y+40+bob,false,o.seed);else rockShape(x,o.y+12+bob,48,32)}else{if(o.type==='rock')rockShape(x,floor-7,55,43);else if(o.type==='roots'||o.type==='reeds')rockShape(x,floor-8,48,34);else if(o.type==='log')logShape(x,floor-3,true);else if(o.type==='weed')weedShape(x,floor+1,true,o.seed);else{rockShape(o.x+11,floor-7,31,28);rockShape(o.x+36,floor-11,29,24)}}}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y+Math.sin(frame*.12)*2);ctx.rotate(player.onGround?Math.sin(frame*.45)*.035:Math.max(-.28,Math.min(.28,player.vy*.025)));if(img.complete&&img.naturalWidth){const ratio=img.naturalWidth/img.naturalHeight,w=66,h=w/ratio;ctx.drawImage(img,-w/2,-h/2,w,h)}else{ctx.fillStyle='#f5a8c3';ctx.beginPath();ctx.ellipse(0,0,25,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e887aa';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.ellipse(-19,i*8,6,4,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#49333e';ctx.beginPath();ctx.arc(10,-5,2.4,0,Math.PI*2);ctx.fill()}ctx.restore()}
function overlay(title,sub){ctx.fillStyle='rgba(2,39,67,.66)';rounded(25,207,310,132,20);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 25px sans-serif';ctx.fillText(title,180,251);ctx.font='bold 14px sans-serif';ctx.fillText(sub,180,281);ctx.font='12px sans-serif';ctx.fillText('画面タップでもスタート！',180,310)}
function render(){background();ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=6)ctx.lineTo(x,groundAt(x));ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle='rgba(226,255,235,.16)';ctx.fill();ctx.beginPath();for(let x=0;x<=W;x+=6){const y=groundAt(x);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.lineTo(W,groundAt(W)+5);for(let x=W;x>=0;x-=6)ctx.lineTo(x,groundAt(x)+5);ctx.closePath();ctx.fillStyle='#c5b98c';ctx.fill();ctx.beginPath();for(let x=0;x<=W;x+=18){const y=groundAt(x);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle='#6e956f';ctx.lineWidth=5;ctx.stroke();for(let x=0;x<W;x+=18){const y=groundAt(x);ctx.strokeStyle='#6e956f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+5,y-7-Math.sin(x*.2+world*.04)*3);ctx.stroke()}obstacles.forEach(obstacle);drawPlayer();if(state==='ready')overlay('準備はいい？','坂道をジャンプで進もう！');if(state==='over')overlay('ゲームオーバー','生存時間 '+elapsed.toFixed(1)+' 秒')}
function loop(t){if(state!=='play')return;const dt=last?Math.min(2,(t-last)/16.667):1;last=t;elapsed+=dt/60;frame+=dt;const d=difficulty(),speed=2.2+d*3.6,level=1+Math.floor(elapsed/10);levelEl.textContent=level;timeEl.textContent=elapsed.toFixed(1)+'s';
world+=speed*dt;const floor=groundAt(player.x);if(player.onGround){player.y=floor-24;player.vy=0}else{player.vy+=.48*dt;player.y+=player.vy*dt;if(player.y+24>=floor&&player.vy>=0){player.y=floor-24;player.vy=0;player.onGround=true}}
const interval=Math.max(48,Math.floor(112-d*42));if(frame%interval<dt)spawn();
obstacles.forEach(o=>{o.x-=speed*dt});obstacles=obstacles.filter(o=>o.x>-70);
let hit=false;for(const o of obstacles){const bob=Math.sin(frame*.055+o.phase)*o.amp,left=o.x+7,right=o.x+43;let top,bottom;if(o.overhead){top=o.y-5+bob;bottom=o.y+39+bob}else{const floor=groundAt(o.x+24);top=floor-48;bottom=floor-1}if(player.x+player.r-5>left&&player.x-player.r+5<right&&player.y+player.r-4>top&&player.y-player.r+4<bottom)hit=true}
if(hit){finish();render();return}render();raf=requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',down);canvas.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});startBtn.addEventListener('click',start);
reset();render();
})();
</script>
