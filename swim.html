<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ウーパールーパー泳ぎ｜大野愛実 ファンサイト</title>
<link rel="stylesheet" href="style.css?v=shared-20261118">
<meta name="theme-color" content="#e60012">
<style>
.swim-intro{text-align:center;margin:4px 0 14px;color:var(--sub);font-size:.84rem}
.swim-hud{display:flex;justify-content:space-between;gap:10px;margin:0 0 9px}
.swim-stat{flex:1;text-align:center;padding:7px;border:1px solid var(--line);border-radius:12px;background:#fff}
.swim-stat small{display:block;color:var(--sub);font-size:.68rem}.swim-stat strong{font-size:1.2rem;color:var(--accent);font-variant-numeric:tabular-nums}
#swimCanvas{display:block;width:100%;height:auto;aspect-ratio:360/560;border:2px solid #f2d6d6;border-radius:20px;background:#bcefff;touch-action:none;overscroll-behavior:contain;box-shadow:0 7px 20px rgba(74,31,22,.08);-webkit-tap-highlight-color:transparent}
.swim-controls{display:flex;justify-content:center;gap:9px;margin:13px 0 4px}
.swim-controls button{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:11px 24px;font:inherit;font-weight:800;box-shadow:0 4px 0 #b90012}
.swim-controls button:active{transform:translateY(2px);box-shadow:0 2px 0 #b90012}
.swim-note{text-align:center;color:var(--sub);font-size:.76rem;margin:10px 0}
</style>
</head>

<div class="wrap">
<header><span class="badge">UNDERWATER GAME</span><h1>うぱうぱスイム</h1><p class="kana">ウーパールーパーと海の冒険！</p></header>
<nav>

</nav>
<main class="memory-wrap">
<p class="swim-intro">タップで上昇！障害物をよけて、どこまで泳げるかな？</p>
<div class="swim-hud"><div class="swim-stat"><small>SCORE</small><strong id="score">0</strong></div><div class="swim-stat"><small>BEST</small><strong id="best">0</strong></div></div>
<canvas id="swimCanvas" width="360" height="560" aria-label="ウーパールーパーの水中アクションゲーム"></canvas>
<div class="swim-controls"><button id="startBtn">泳ぎはじめる！</button></div>
<p class="swim-note">画面をタップすると上に泳ぐよ。岩やサンゴにぶつからないでね 🫧</p>
</main>
</div>
<script>
(()=> {
const canvas=document.getElementById('swimCanvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),startBtn=document.getElementById('startBtn');
const W=360,H=560,player={x:88,y:275,vy:0,r:19},img=new Image();img.src='axolotl.png';
let state='ready',score=0,best=Number(localStorage.getItem('upaSwimBest')||0),frames=0,speed=2.25,obstacles=[],bubbles=[],trailBubbles=[],powerups=[],scoreTexts=[],invincible=0,last=0,raf=0;
bestEl.textContent=best;
function reset(){score=0;frames=0;speed=2.25;player.y=275;player.vy=0;obstacles=[];bubbles=[];trailBubbles=[];powerups=[];scoreTexts=[];invincible=0;for(let i=0;i<9;i++)bubbles.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*4,s:.4+Math.random()*1.1});scoreEl.textContent='0'}
function spawn(){const gap=Math.max(142,188-frames*.012),top=75+Math.random()*(H-gap-150);obstacles.push({x:W+20,top,gap,passed:false,seed:Math.random()*10})}
function start(){cancelAnimationFrame(raf);reset();state='play';startBtn.textContent='もう一度泳ぐ';player.vy=-4.6;last=0;raf=requestAnimationFrame(loop)}
function flap(){if(state==='ready'||state==='over'){start();return}if(state==='play')player.vy=-4.8}
function end(){state='over';if(score>best){best=score;localStorage.setItem('upaSwimBest',best);bestEl.textContent=best}startBtn.textContent='もう一度泳ぐ'}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawBackground(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9ce8ff');g.addColorStop(1,'#e2fbff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<5;i++){let x=(i*91-frames*.35%450+450)%450;ctx.beginPath();ctx.ellipse(x,90+i*77,28,7,0,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='#9bdc9b';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=8)ctx.lineTo(x,H-18-Math.sin(x*.035+frames*.025)*9);ctx.lineTo(W,H);ctx.fill()}
function drawObstacle(o){const bottom=o.top+o.gap;ctx.fillStyle='#ed9b75';ctx.strokeStyle='#d47b5d';ctx.lineWidth=3;
rounded(o.x,0,48,o.top-22,12);ctx.strokeRect(o.x+1,0,46,o.top-23);
rounded(o.x,bottom+22,48,H-bottom-22,12);ctx.strokeRect(o.x+1,bottom+23,46,H-bottom-24);
ctx.fillStyle='#f8bd8e';rounded(o.x-5,o.top-31,58,18,8);rounded(o.x-5,bottom+13,58,18,8);
ctx.fillStyle='#73c98a';for(let k=0;k<3;k++){let xx=o.x+8+k*15;ctx.beginPath();ctx.ellipse(xx,o.top-36-Math.sin(frames*.04+k)*5,5,14,.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(xx,bottom+39+Math.sin(frames*.04+k)*5,5,14,-.3,0,Math.PI*2);ctx.fill()}}
function drawScoreTexts(){scoreTexts.forEach(s=>{ctx.save();ctx.globalAlpha=Math.max(0,1-s.life/42);ctx.fillStyle='#c17b00';ctx.font='bold 17px sans-serif';ctx.textAlign='center';ctx.shadowColor='#fff';ctx.shadowBlur=4;ctx.fillText(s.text,s.x,s.y-s.life*.65);ctx.restore()})}
function drawPowerup(p){const pulse=1+Math.sin(frames*.15)*.12;ctx.save();ctx.translate(p.x,p.y);ctx.scale(pulse,pulse);ctx.shadowColor='#fff18a';ctx.shadowBlur=14;ctx.fillStyle='#ffe77a';ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#e5a900';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,1);ctx.restore()}
function drawPlayer(){const swim=Math.sin(frames*.22),kick=Math.sin(frames*.34);ctx.save();ctx.translate(player.x,player.y+swim*3.5);ctx.rotate(Math.max(-.24,Math.min(.3,player.vy*.035))+Math.sin(frames*.18)*.055);const sx=1+Math.sin(frames*.34)*.045,sy=1-Math.sin(frames*.34)*.045;ctx.scale(sx,sy);
if(img.complete&&img.naturalWidth){let ratio=img.naturalWidth/img.naturalHeight;let w=64,h=w/ratio;ctx.drawImage(img,-w/2,-h/2,w,h)}else{ctx.fillStyle='#f3a4bd';ctx.beginPath();ctx.ellipse(0,0,25,17,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ef8cab';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.ellipse(-15,i*8,5,4,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#633';ctx.beginPath();ctx.arc(9,-4,2,0,Math.PI*2);ctx.fill()}
// えらと小さなヒレにリズムをつけて、水をかいている動きを演出
ctx.strokeStyle='rgba(239,133,174,.78)';ctx.lineWidth=2.2;ctx.lineCap='round';for(let i=0;i<3;i++){const yy=-8+i*7,wiggle=Math.sin(frames*.34+i*.8)*3;ctx.beginPath();ctx.moveTo(-19,yy);ctx.quadraticCurveTo(-27-wiggle,yy-5,-30-wiggle,yy-10);ctx.stroke()}
ctx.restore();if(invincible>0){ctx.save();ctx.translate(player.x,player.y);const pulse=1+Math.sin(frames*.25)*.06;ctx.scale(pulse,pulse);ctx.strokeStyle='rgba(255,225,92,.95)';ctx.lineWidth=4;ctx.shadowColor='#fff18a';ctx.shadowBlur=17;ctx.beginPath();ctx.arc(0,0,39+Math.sin(frames*.2)*2,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('むてき！',0,-48);ctx.restore()}}
function drawOverlay(title,sub){ctx.fillStyle='rgba(255,255,255,.78)';rounded(27,205,306,128,20);ctx.textAlign='center';ctx.fillStyle='#b90012';ctx.font='900 25px sans-serif';ctx.fillText(title,180,250);ctx.fillStyle='#674b48';ctx.font='bold 14px sans-serif';ctx.fillText(sub,180,281);ctx.font='12px sans-serif';ctx.fillText('下のボタンからスタート！',180,307)}
function render(){drawBackground();obstacles.forEach(drawObstacle);powerups.forEach(drawPowerup);drawScoreTexts();trailBubbles.forEach(b=>{ctx.fillStyle='rgba(255,255,255,.82)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(89,190,218,.45)';ctx.stroke()});bubbles.forEach(b=>{ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(74,174,207,.35)';ctx.stroke()});drawPlayer();if(state==='ready')drawOverlay('準備はいい？','タップで上に泳ぐよ！');if(state==='over')drawOverlay('ゲームオーバー！','今回のスコア：'+score+' 点')}
function loop(t){if(state!=='play')return;const dt=last?Math.min(2,(t-last)/16.67):1;last=t;frames+=dt;if(invincible>0)invincible=Math.max(0,invincible-dt);speed=Math.min(4.8,2.25+frames*.00065);player.vy=Math.min(5.8,player.vy+.23*dt);player.y+=player.vy*dt;
if(frames%Math.max(64,Math.floor(105-frames*.018))<dt)spawn();
if(frames%420<dt)powerups.push({x:W+18,y:105+Math.random()*350});
obstacles.forEach(o=>{o.x-=speed*dt;if(!o.passed&&o.x+48<player.x){o.passed=true;score++;scoreEl.textContent=score}});
obstacles=obstacles.filter(o=>o.x>-65);
powerups.forEach(p=>p.x-=speed*dt);powerups=powerups.filter(p=>p.x>-25);
for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];if(Math.hypot(p.x-player.x,p.y-player.y)<34){invincible=300;score+=5;scoreEl.textContent=score;scoreTexts.push({x:player.x+12,y:player.y-28,text:'+5 POINTS!',life:0});powerups.splice(i,1)}}
bubbles.forEach(b=>{b.x-=speed*.25*dt;b.y-=b.s*dt;if(b.y< -8){b.y=H+8;b.x=Math.random()*W}if(b.x< -8)b.x=W+8});
if(frames%7<dt)trailBubbles.push({x:player.x-24,y:player.y+(Math.random()-.5)*13,r:1.8+Math.random()*2.2,life:0});trailBubbles.forEach(b=>{b.x-=1.15*dt;b.y-=.35*dt;b.life+=dt;b.r*=.997});trailBubbles=trailBubbles.filter(b=>b.life<42);scoreTexts.forEach(s=>s.life+=dt);scoreTexts=scoreTexts.filter(s=>s.life<42);
let hit=player.y<8||player.y>H-8;
if(invincible<=0){for(const o of obstacles){if(player.x+player.r>o.x-3&&player.x-player.r<o.x+51&&(player.y-player.r<o.top||player.y+player.r>o.top+o.gap))hit=true}}
if(hit){end();render();return}render();raf=requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap()});canvas.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});canvas.addEventListener('gesturestart',e=>e.preventDefault());canvas.addEventListener('gesturechange',e=>e.preventDefault());canvas.addEventListener('gestureend',e=>e.preventDefault());startBtn.addEventListener('click',start);reset();render();
})();
</script>
<script id="manami-nav-active">(()=>{const current=location.pathname.split("/").pop()||"index.html";document.querySelectorAll("nav a[href]").forEach(a=>{const target=new URL(a.getAttribute("href"),location.href).pathname.split("/").pop();if(target===current){a.classList.add("on");a.setAttribute("aria-current","page");}else{a.classList.remove("on");a.removeAttribute("aria-current");}});})();</script>

</body></html>
